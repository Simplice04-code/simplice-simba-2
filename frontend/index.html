<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simba Supermarket — Rwanda's Online Supermarket</title>
  <meta name="description" content="Shop online at Simba Supermarket Kigali. Fresh products, fast delivery across Rwanda." />
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo" data-route="home">
        <div class="logo-circle">
          <img src="assets/logo.png" alt="Simba Supermarket logo" class="logo-image" />
        </div>
        <div class="logo-text">
          <span class="logo-name">Simba</span>
          <span class="logo-sub">Supermarket</span>
        </div>
      </a>

      <div class="nav-search">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="globalSearch" placeholder="Search products..." class="search-input" autocomplete="off" />
          <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
      </div>

      <nav class="nav-actions">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="rw">RW</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
        <button class="icon-btn cart-btn" data-route="cart" title="Shopping cart">
          🛒 <span class="cart-badge" id="cartBadge">0</span>
        </button>
        <div class="user-menu" id="userMenu">
          <button class="btn btn-outline" data-route="login" id="loginBtn">Login</button>
          <div class="user-dropdown hidden" id="userDropdown">
            <button class="user-avatar" id="userAvatarBtn">👤 <span id="userNameNav"></span> ▾</button>
            <div class="dropdown-menu" id="dropdownMenu">
              <a href="#" data-route="profile">👤 My Profile</a>
              <a href="#" data-route="orders">📦 My Orders</a>
              <a href="#" id="logoutBtn">🚪 Logout</a>
            </div>
          </div>
        </div>
      </nav>

      <button class="hamburger" id="hamburger">☰</button>
    </div>

    <!-- Mobile nav -->
    <div class="mobile-nav hidden" id="mobileNav">
      <input type="text" id="mobileSearch" placeholder="Search products..." class="search-input" />
      <a href="#" data-route="home" class="mobile-link">🏠 Home</a>
      <a href="#" data-route="products" class="mobile-link">🛍️ Products</a>
      <a href="#" data-route="cart" class="mobile-link">🛒 Cart</a>
      <a href="#" data-route="profile" class="mobile-link" id="mobileProfileLink">👤 Profile</a>
      <a href="#" data-route="login" class="mobile-link" id="mobileLoginLink">🔑 Login</a>
    </div>
  </header>

  <!-- ===== CATEGORY BAR ===== -->
  <div class="category-bar" id="categoryBar">
    <div class="category-bar-inner" id="categoryBarInner">
      <button class="cat-pill active" data-category="">All Products</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="app">
    <div class="loader-overlay" id="pageLoader">
      <div class="loader-spinner"></div>
    </div>
  </main>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== CART SIDEBAR ===== -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h2 data-i18n="cart.title">Shopping Cart</h2>
      <button class="close-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-body" id="cartBody">
      <div class="empty-state">
        <span class="empty-icon">🛒</span>
        <p data-i18n="cart.empty">Your cart is empty</p>
      </div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <span data-i18n="cart.total">Total</span>
        <strong id="cartTotal">0 RWF</strong>
      </div>
      <button class="btn btn-primary w-full" id="checkoutBtn" data-route="checkout">
        <span data-i18n="cart.checkout">Proceed to Checkout</span>
      </button>
    </div>
  </aside>

  <!-- ===== PRODUCT MODAL ===== -->
  <div class="modal-overlay hidden" id="productModal">
    <div class="modal" id="productModalContent">
      <button class="modal-close" id="closeModal">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="data/static-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/product-detail.js"></script>
  <script src="js/pages/checkout.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
